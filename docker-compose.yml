services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
    image: zaid-ahmed-portfolio:latest
    container_name: zaid-ahmed-portfolio
    ports:
      - "${PORTFOLIO_PORT:-8080}:80"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
